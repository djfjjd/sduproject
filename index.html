<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="대학교 과제용 URL 단축 및 QR 코드 생성 도구" />
    <meta name="theme-color" content="#f5f3ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="URL2QR" />
    <title>2025450018 최재형 바이브코딩 과제용</title>
    <link rel="icon" type="image/png" sizes="32x32" href="public/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="public/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="tool-card" aria-label="URL 단축 및 QR 코드 생성기">
        <img class="brand-image" src="public/icon-512.png" alt="URL to QR" />

        <form id="link-form" novalidate>
          <label for="url-input">URL 입력</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <input id="url-input" name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/assignment" required />
          </div>
          <p id="error-message" class="error-message" role="alert"></p>

          <div class="actions">
            <button id="shorten-btn" class="button primary" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              <span id="shorten-label">URL 단축하기</span><span id="loading-dots" class="loading-dots" hidden></span>
            </button>
          </div>
        </form>

        <section id="result" class="result" aria-live="polite">
          <div id="short-result" class="short-result">
            <span class="result-label">결과값</span>
            <div class="result-value-wrap">
              <input id="short-url" class="result-value is-placeholder" type="text" value="url 입력 후 단축하기를 눌러주세요" readonly aria-label="단축 URL 결과값" />
              <button id="copy-btn" class="copy-button" type="button" aria-label="결과값 클립보드에 복사" disabled>
                <span>복사하기</span>
                <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="6" y="5" width="13" height="16" rx="2"/><path d="M9 5V3h7v2M9 9h7M9 13h7M9 17h5"/></svg>
              </button>
            </div>
            <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
            <button id="qr-btn" class="button secondary result-qr-button" type="button" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 18v3"/></svg>
              QR 코드 만들기
            </button>
            <div id="qr-result" class="qr-result" hidden>
              <div class="qr-frame"><img id="qr-image" alt="생성된 QR 코드" /></div>
              <button id="download-btn" class="download-button" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
                <span id="download-label">다운로드</span>
              </button>
            </div>
          </div>
        </section>

      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
