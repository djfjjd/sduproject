<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="대학교 과제용 URL 단축 및 QR 코드 생성 도구" />
    <title>Link Lab · 과제용 링크 도구</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="tool-card" aria-labelledby="page-title">
        <div class="eyebrow"><span></span> ASSIGNMENT TOOLKIT</div>
        <h1 id="page-title">링크를 더 간단하게.</h1>
        <p class="intro">과제에 넣을 주소를 붙여 넣고, 필요한 형태로 바로 변환하세요.</p>

        <form id="link-form" novalidate>
          <label for="url-input">URL 입력</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <input id="url-input" name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/assignment" required />
          </div>
          <p id="error-message" class="error-message" role="alert"></p>

          <div class="actions">
            <button id="shorten-btn" class="button primary" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              URL 단축하기
            </button>
            <button id="qr-btn" class="button secondary" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 18v3"/></svg>
              QR 코드 만들기
            </button>
          </div>
        </form>

        <section id="result" class="result" aria-live="polite" hidden>
          <div id="short-result" class="short-result" hidden>
            <div>
              <span class="result-label">단축 URL</span>
              <a id="short-url" href="#" target="_blank" rel="noopener"></a>
            </div>
            <button id="copy-btn" class="copy-button" type="button">복사</button>
          </div>
          <div id="qr-result" class="qr-result" hidden>
            <div class="qr-frame"><img id="qr-image" alt="생성된 QR 코드" /></div>
            <div>
              <span class="result-label">QR 코드 완성</span>
              <p>이미지를 길게 누르거나 우클릭해 저장하세요.</p>
              <a id="download-btn" class="text-link" href="#" download="assignment-qr.png">이미지 열기 ↗</a>
            </div>
          </div>
        </section>

        <p class="privacy-note">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          입력한 링크는 이 사이트에 저장되지 않습니다.
        </p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
